name: QA Banking
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Убедимся, что Docker запущен (теперь без sudo)
      - name: Start Docker service
        run: |
          systemctl --user start docker 2>/dev/null || sudo systemctl start docker
          # Если docker работает как пользовательский сервис, используйте systemctl --user,
          # иначе оставьте sudo (но тогда нужно настроить NOPASSWD в sudoers)
          docker info  # проверяем, что команда работает

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build base Docker image
        run: docker build -f Dockerfile.base -t base-service .

      - name: Start test services
        run: docker compose -f docker-compose.ci.yaml up -d --build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regressions tests and generate Allure report
        run: python -m pytest -m "regression" --alluredir=./allure-results

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results

  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure Report with history
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history