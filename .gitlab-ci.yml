stages:
  - prepare
  - test
  - report
  - deploy

variables:
  ALLURE_HISTORY_DIR: "allure-history"

download-history:
  stage: prepare
  script:
    - echo "Загружаем историю из артефактов предыдущего пайплайна..."
    - |
      # Получаем ID последнего успешного пайплайна для ветки main
      PIPELINE_ID=$(curl -s --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/pipelines?ref=main&status=success&per_page=1" | grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)
      if [ -n "$PIPELINE_ID" ] && [ "$PIPELINE_ID" != "null" ]; then
        echo "Найден пайплайн ID: $PIPELINE_ID"
        # Скачиваем артефакты из задачи publish-report этого пайплайна
        curl -L --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/pipelines/$PIPELINE_ID/jobs/artifacts?job=publish-report" -o artifacts.zip || echo "Артефакты не найдены"
        if [ -f artifacts.zip ]; then
          unzip -o artifacts.zip -d .
          rm artifacts.zip
          if [ -d "$ALLURE_HISTORY_DIR" ]; then
            echo "История загружена"
          else
            echo "Папка истории не найдена в артефактах, создаём пустую"
            mkdir -p $ALLURE_HISTORY_DIR
          fi
        else
          echo "Артефакты не найдены, создаём пустую историю"
          mkdir -p $ALLURE_HISTORY_DIR
        fi
      else
        echo "Не найден успешный пайплайн, создаём пустую историю"
        mkdir -p $ALLURE_HISTORY_DIR
      fi
  artifacts:
    paths:
      - $ALLURE_HISTORY_DIR
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

test-job:
  stage: test
  allow_failure: true
  needs:
    - job: download-history
      artifacts: true
  before_script:
    - export PYENV_ROOT="$HOME/.pyenv"
    - export PATH="$PYENV_ROOT/bin:$PATH"
    - eval "$(pyenv init -)"
  script:
    - docker build -f Dockerfile.base -t base-service .
    - docker compose -f docker-compose.yaml up -d --build
    - python3.12 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install swagger-coverage-tool
    - mkdir -p allure-results
    - cp -r $ALLURE_HISTORY_DIR/* allure-results/ 2>/dev/null || true
    - python -m pytest -m "regression" --alluredir=./allure-results
  after_script:
    - docker compose -f docker-compose.yaml down -v
  artifacts:
    when: always
    paths:
      - allure-results/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

publish-report:
  stage: report
  allow_failure: true
  needs:
    - job: test-job
      artifacts: true
  script:
    - mkdir -p public
    - allure generate allure-results -o public --clean
    - mkdir -p allure-history
    - cp -r public/history/* allure-history/ 2>/dev/null || true
    # Архивируем историю для будущих запусков
    - zip -r history.zip allure-history/ 2>/dev/null || true
    # Копируем архив в public, чтобы он был доступен на Pages (опционально)
    - cp history.zip public/ || true
  artifacts:
    when: always
    paths:
      - public/
      - allure-history/
      - history.zip
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

pages:
  stage: deploy
  needs:
    - job: publish-report
      artifacts: true
  script:
    - ls -la public
    - ls -la public/history/ 2>/dev/null || echo "История пока пуста"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"