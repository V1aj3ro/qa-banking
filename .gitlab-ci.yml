stages:
  - prepare
  - test
  - report
  - deploy

variables:
  ALLURE_HISTORY_DIR: "allure-history"

download-history:
  stage: prepare
  script:
    - mkdir -p $ALLURE_HISTORY_DIR
    - echo "Загружаем историю с GitLab Pages..."
    - |
      URL="${CI_PAGES_URL}/history.zip"
      echo "URL: $URL"
      curl -L -o history.zip "$URL" || echo "Не удалось скачать history.zip"
      if [ -f history.zip ] && [ -s history.zip ]; then
        if file history.zip | grep -q "Zip archive"; then
          unzip -o history.zip -d $ALLURE_HISTORY_DIR
          rm history.zip
          echo "История загружена"
        else
          echo "Скачанный файл не zip, содержимое:"
          cat history.zip
          rm history.zip
        fi
      else
        echo "История не найдена, создаём пустую"
      fi
  artifacts:
    paths:
      - $ALLURE_HISTORY_DIR
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

test-job:
  stage: test
  allow_failure: true
  needs:
    - job: download-history
      artifacts: true
  before_script:
    - export PYENV_ROOT="$HOME/.pyenv"
    - export PATH="$PYENV_ROOT/bin:$PATH"
    - eval "$(pyenv init -)"
  script:
    - docker build -f Dockerfile.base -t base-service .
    - docker compose -f docker-compose.yaml up -d --build
    - python3.12 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install swagger-coverage-tool
    - mkdir -p allure-results
    - cp -r $ALLURE_HISTORY_DIR/* allure-results/ 2>/dev/null || true
    - python -m pytest -m "regression" --alluredir=./allure-results
  after_script:
    - docker compose -f docker-compose.yaml down -v
  artifacts:
    when: always
    paths:
      - allure-results/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

publish-report:
  stage: report
  allow_failure: true
  needs:
    - job: test-job
      artifacts: true
  script:
    - mkdir -p public
    - allure generate allure-results -o public --clean
    - mkdir -p allure-history
    - cp -r public/history/* allure-history/ 2>/dev/null || true
    - zip -r history.zip allure-history/ 2>/dev/null || true
    - cp history.zip public/
  artifacts:
    when: always
    paths:
      - public/
      - allure-history/
      - history.zip
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

pages:
  stage: deploy
  needs:
    - job: publish-report
      artifacts: true
  script:
    - ls -la public
    - ls -la public/history/ 2>/dev/null || echo "История пока пуста"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"