stages:
  - test
  - report
  - deploy


test-job:
  stage: test
  image: ubuntu:24.04
  allow_failure: true
  before_script:
    - export PYENV_ROOT="$HOME/.pyenv"
    - export PATH="$PYENV_ROOT/bin:$PATH"
    - eval "$(pyenv init -)"
  script:
    - docker build -f Dockerfile.base -t base-service .
    - docker compose -f docker-compose.yaml up -d --build
    - python3.12 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install swagger-coverage-tool
    - mkdir -p allure-results
    - python -m pytest -m "regression" --alluredir=./allure-results
  after_script:
    - docker compose -f docker-compose.yaml down -v
  artifacts:
    when: always
    paths:
      - allure-results/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

publish-report:
  stage: test
  image: ubuntu:24.04
  allow_failure: true

  before_script:
    - apt-get update
    - apt-get install -y openjdk-11-jre wget tar
    - wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
    - tar -xvf allure-2.32.0.tgz
  script:
    - allure-2.32.0/bin/allure generate allure-results -o allure-report --clean
  needs: ["test-job"]
  artifacts:
    when: always
    paths:
      - allure-report/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r allure-report/* public/;
  artifacts:
    paths:
      - public
  needs: ["publish-report"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"