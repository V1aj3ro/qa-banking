stages:
  - test
  - report

variables:
  COMPOSE_HTTP_TIMEOUT: 120

test-job:
  stage: test
  before_script:
    - export PYENV_ROOT="$HOME/.pyenv"
    - export PATH="$PYENV_ROOT/bin:$PATH"
    - eval "$(pyenv init -)"
  script:
    - docker build -f Dockerfile.base -t base-service .
    - docker compose -f docker-compose.yaml up -d --build

    - python3.12 -m venv venv
    - source venv/bin/activate

    - pip install --upgrade pip
    - pip install -r requirements.txt

    - python -m pytest -m "regression" --alluredir=./allure-results || True

  after_script:
    - docker compose -f docker-compose.yaml down -v

  artifacts:
    when: always
    paths:
      - allure-results

pages:
  stage: report
  script:
    - mkdir -p public
    - docker run --rm -v "$PWD/allure-results:/allure-results" -v "$PWD/public:/public" frankescobar/allure-docker-service allure generate /allure-results -o /public --clean
  artifacts:
    paths:
      - public
  dependencies:
    - test-job
  rules:
    - if: $CI_COMMIT_BRANCH == "main"