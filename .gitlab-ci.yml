stages:
  - prepare
  - test
  - report
  - deploy

variables:
  ALLURE_HISTORY_DIR: "allure-history"

download-history:
  stage: prepare
  script:
    - mkdir -p $ALLURE_HISTORY_DIR
    - echo "Загружаем историю из ветки allure-history..."
    - |
      git fetch origin allure-history 2>/dev/null || echo "Ветка allure-history не найдена"
      if git ls-remote --heads origin allure-history | grep -q allure-history; then
        git checkout origin/allure-history -- $ALLURE_HISTORY_DIR 2>/dev/null || echo "Папка истории не найдена в ветке"
        if [ -d "$ALLURE_HISTORY_DIR" ] && [ -n "$(ls -A $ALLURE_HISTORY_DIR)" ]; then
          echo "История загружена из ветки allure-history"
        else
          echo "Папка истории пуста, создаём пустую"
          mkdir -p $ALLURE_HISTORY_DIR
        fi
      else
        echo "Ветка allure-history не существует, создаём пустую историю "
        mkdir -p $ALLURE_HISTORY_DIR
      fi
  artifacts:
    paths:
      - $ALLURE_HISTORY_DIR
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

test-job:
  stage: test
  allow_failure: true
  needs:
    - job: download-history
      artifacts: true
  before_script:
    - export PYENV_ROOT="$HOME/.pyenv"
    - export PATH="$PYENV_ROOT/bin:$PATH"
    - eval "$(pyenv init -)"
  script:
    - docker build -f Dockerfile.base -t base-service .
    - docker compose -f docker-compose.yaml up -d --build
    - python3.12 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install swagger-coverage-tool
    - mkdir -p allure-results
    - cp -r $ALLURE_HISTORY_DIR/* allure-results/ 2>/dev/null || true
    - python -m pytest -m "regression" --alluredir=./allure-results
  after_script:
    - docker compose -f docker-compose.yaml down -v
  artifacts:
    when: always
    paths:
      - allure-results/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

publish-report:
  stage: report
  allow_failure: true
  needs:
    - job: test-job
      artifacts: true
  script:
    - mkdir -p public
    - allure generate allure-results -o public --clean
    - mkdir -p allure-history
    - cp -r public/history/* allure-history/ 2>/dev/null || true
    - |
      git config user.email "ci@gitlab.com"
      git config user.name "GitLab CI"
      if git ls-remote --heads origin allure-history | grep -q allure-history; then
        git fetch origin allure-history
        git checkout -b allure-history origin/allure-history || git checkout allure-history
      else
        git checkout --orphan allure-history
        git rm -rf . 2>/dev/null || true
      fi
      rm -rf allure-history
      cp -r public/history allure-history 2>/dev/null || mkdir -p allure-history
      git add allure-history
      git commit -m "Update Allure history for pipeline $CI_PIPELINE_ID" || echo "Нет изменений в истории"
      git push origin allure-history
  artifacts:
    when: always
    paths:
      - public/
      - allure-history/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

pages:
  stage: deploy
  needs:
    - job: publish-report
      artifacts: true
  script:
    - ls -la public
    - ls -la public/history/ 2>/dev/null || echo "История пока пуста"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"