name: QA Banking
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start Docker service
        run: |
          sudo systemctl start docker
          docker info

      - name: Build base Docker image
        run: docker build -f Dockerfile.base -t base-service .

      - name: Start test services
        run: docker compose -f docker-compose.ci.yaml up -d --build

      - name: Set up Python virtual environment
        run: |
          python3.12 -m venv venv
          source venv/bin/activate
          python --version
          pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run regressions tests and generate Allure report
        run: |
          source venv/bin/activate
          pytest -m "regression" --alluredir=./allure-results

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results

  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Install Allure (if not available)
        run: |
          if ! command -v allure &> /dev/null; then
            echo "Installing Allure..."
            ALLURE_VERSION="2.32.2"
            wget -q "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip" -O /tmp/allure.zip
            unzip -q /tmp/allure.zip -d /tmp/allure
            sudo cp -r /tmp/allure/allure-${ALLURE_VERSION}/* /usr/local/
            sudo ln -sf /usr/local/bin/allure /usr/local/bin/allure
            rm -rf /tmp/allure /tmp/allure.zip
          else
            echo "Allure already installed."
          fi

      - name: Generate Allure Report with history
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            allure generate allure-results -o allure-history --clean
          else
            echo "No test results found, creating empty report."
            mkdir -p allure-history
            echo '<html><body><h1>No tests executed</h1></body></html>' > allure-history/index.html
          fi

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-history
          keep_files: false
          force_orphan: false